# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: excalidraw-common
  description: "UDS Excalidraw Common Package"

components:
  - name: excalidraw
    required: true
    charts:
      # App Chart
      - name: excalidraw
        releaseName: excalidraw
        namespace: excalidraw
        version: 0.1.0
        localPath: ../charts/excalidraw
        valuesFiles:
          - ../values/common-values.yaml
      
      # UDS config chart
      - name: uds-excalidraw-config
        releaseName: uds-excalidraw-config
        namespace: excalidraw
        version: 0.1.0
        localPath: ../chart
        valuesFiles:
          - ../values/config-values.yaml
