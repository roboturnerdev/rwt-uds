image:
  repository: docker.io/excalidraw/excalidraw
  digest: "sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podLabels:
  app.kubernetes.io/name: excalidraw


readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20