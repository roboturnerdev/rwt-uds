# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig

metadata:
  name: excalidraw
  description: Excalidraw packaged for disconnected deployment on UDS Core
  version: "0.18.1-uds.0"
  vendor: Excalidraw Community
  source: https://github.com/excalidraw/excalidraw

  annotations:
    dev.uds.title: "Excalidraw"
    dev.uds.categories: "Productivity, Web"
    dev.uds.keywords: "Whiteboard, Diagramming, Drawing, Canvas"
    dev.uds.tagline: "Open source virtual whiteboard for diagrams"

documentation:
  readme: docs/README.md
  configuration: docs/configuration.md
  dependencies: docs/dependencies.md
  justifications: docs/justifications.md

components:
  - name: excalidraw
    description: Deploy the upstream Excalidraw frontend
    required: true

    import:
      path: common

    only:
      flavor: upstream

    charts:
      - name: excalidraw
        valuesFiles:
          - values/upstream-values.yaml

    images:
      - docker.io/excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9