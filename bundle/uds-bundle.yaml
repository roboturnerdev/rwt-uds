kind: UDSBundle

metadata:
  name: excalidraw-test
  description: Local development bundle for Excalidraw
  version: 0.18.1-uds.0-upstream

packages:
  - name: excalidraw
    path: ../
    ref: 0.18.1-uds.0-upstream

    overrides:
      excalidraw:
        uds-excalidraw-config:
          values:
            - path: domain
              value:
                host: excalidraw
                name: uds.dev

            - path: sso.groups
              value:
                - "/UDS Core/Admin"

        excalidraw:
          values:
            - path: replicaCount
              value: 1