# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/refs/heads/main/tasks.schema.json
tasks:
  - name: all
    actions:
      - task: health-check
      - task: ingress
      - task: ui

  # Ensure application deploys successfully and becomes available
  - name: health-check
    actions:
      - description: Excalidraw Health Check
        wait:
          cluster:
            kind: Deployment
            name: excalidraw
            namespace: excalidraw
            condition: Available

  - name: ingress
    actions:
      - description: "Excalidraw Ingress Status Check"
        maxRetries: 30
        cmd: |
          STATUS=$(curl -L -o /dev/null -s -w "%{http_code}\n" https://excalidraw.uds.dev)
          echo "Excalidraw system status: ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            sleep 10
            exit 1
          fi

  - name: ui
    description: Excalidraw UI Checks
    actions:
      - cmd: |
          docker run --rm \
            --network=host \
            --shm-size=1g \
            --security-opt seccomp=unconfined \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e NPM_CONFIG_CACHE=/tmp/.npm \
            -v "$(pwd)":/app -w /app \
            mcr.microsoft.com/playwright:v1.61.1 \
            bash -lc "npm ci && npx playwright test"
        dir: tests
