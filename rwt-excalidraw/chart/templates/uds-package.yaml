apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: excalidraw
  namespace: {{ .Release.Namespace }}
spec:
  network:
    serviceMesh:
      mode: ambient
    expose:
      - description: Excalidraw web application
        service: {{ .Values.service.name }}
        selector:
          {{- toYaml .Values.selector | nindent 10 }}
        gateway: tenant
        host: {{ .Values.domain.host }}
        port: {{ .Values.service.port }}
        targetPort: {{ .Values.service.targetPort }}
        uptime:
          checks:
            paths:
              - / # there is no prometheus metrics so this will have to do

    # Excalidraw is a static frontend and has no required application
    # dependencies or external egress in this package scope.
    allow:
      {{- with .Values.additionalNetworkAllow }}
      {{- toYaml . | nindent 6 }}
      {{- else }}
      []
      {{- end }}
  {{- if .Values.sso.enabled }}
  sso:
    - name: Excalidraw Login
      protocol: openid-connect
      clientId: {{ .Values.sso.clientId }}
      # Authservice redirect URIs cannot use only the root path.
      redirectUris:
        - "https://{{ .Values.domain.host }}.{{ .Values.domain.name }}/login"
      enableAuthserviceSelector:
        {{- toYaml .Values.selector | nindent 8 }}
      groups:
        anyOf:
          {{- range .Values.sso.groups }}
          - {{ . | quote }}
          {{- end }}
  {{- end }}