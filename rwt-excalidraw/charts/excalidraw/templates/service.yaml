apiVersion: v1
kind: Service
metadata:
  name: excalidraw
  labels:
    {{- include "excalidraw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: excalidraw
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP